services:
  postgres:
    image: postgres:16-alpine
    container_name: taskforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRESS_PASSWORD}
    ports:
        - "5432:5432"
    volumes:
        - taskforge_pgdata:/var/lib/postgresql/data
volumes:
  taskforge_pgdata: